<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Budget</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <meta name="theme-color" content="#0D9488">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">

  <!-- ── Header ── -->
  <header id="header">
    <span class="logo">Budget<em>.</em></span>
    <div class="header-actions">
      <button class="icon-btn" id="settings-btn" aria-label="Instellingen">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <button class="icon-btn" id="theme-btn" aria-label="Thema wisselen">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ── Main content ── -->
  <main id="main">

    <!-- Home / Overzicht -->
    <div class="view active" id="view-home">
      <div class="month-nav">
        <button class="month-nav-btn" id="h-prev">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span class="month-label" id="h-mlabel"></span>
        <button class="month-nav-btn" id="h-next">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <div class="card"><div class="donut-wrap" id="h-donut"></div></div>
      <p class="section-label">Recente transacties</p>
      <div id="h-recent"></div>
    </div>

    <!-- Transacties -->
    <div class="view" id="view-transacties">
      <div class="month-nav">
        <button class="month-nav-btn" id="t-prev">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span class="month-label" id="t-mlabel"></span>
        <button class="month-nav-btn" id="t-next">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <div id="t-list"></div>
    </div>

    <!-- Statistieken -->
    <div class="view" id="view-statistieken">
      <p class="section-label">Laatste 6 maanden</p>
      <div class="card"><div class="bar-chart-inner" id="s-monthly"></div></div>
      <p class="section-label">Per categorie (huidige maand)</p>
      <div class="card"><div class="bar-chart-inner" id="s-cats"></div></div>
    </div>

  </main>

  <!-- ── Floating action button ── -->
  <button id="fab" aria-label="Transactie toevoegen">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>

  <!-- ── Bottom navigation ── -->
  <nav id="bnav">
    <button class="nb active" data-v="home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9,22 9,12 15,12 15,22"/>
      </svg>
      Overzicht
    </button>
    <button class="nb" data-v="transacties">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/>
        <line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
      Transacties
    </button>
    <button class="nb" data-v="statistieken">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      Statistieken
    </button>
  </nav>

</div><!-- #app -->

<!-- ── Modal bottom sheet ── -->
<div id="moverlay" hidden>
  <div id="msheet">
    <div class="mhandle"></div>
    <div id="mcontent"></div>
  </div>
</div>

<!-- Scripts (load order matters: format → db → render → modal → app) -->
<script src="js/version.js"></script>
<script src="js/format.js"></script>
<script src="js/db.js"></script>
<script src="js/render.js"></script>
<script src="js/modal.js"></script>
<script src="js/app.js"></script>

</body>
</html>
