name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Stap 1: Tests ──────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Dependencies installeren
        run: npm ci

      - name: Tests draaien
        run: npm test

  # ── Stap 2: Versie bijwerken (alleen na geslaagde tests, alleen op main) ───
  bump-version:
    name: Versie bijwerken
    runs-on: ubuntu-latest
    needs: test
    if: "github.ref == 'refs/heads/main' && github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: versie bijgewerkt')"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Versie instellen op datum + uur (CET/CEST)
        run: |
          VERSION=$(TZ="Europe/Brussels" python3 -c "from datetime import datetime; d=datetime.now(); print(str(d.year)+'.'+str(d.month)+'.'+str(d.day)+'.'+str(d.hour)+'.'+str(d.minute))")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          sed -i "s/var APP_VERSION = '.*';/var APP_VERSION = '$VERSION';/" js/version.js
          sed -i "s/const CACHE = '.*';/const CACHE = 'budget-$VERSION';/" sw.js

      - name: Commit en push versie
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git
          git add js/version.js sw.js
          git diff --staged --quiet && echo "Geen wijzigingen" || (
            git commit -m "chore: versie bijgewerkt naar $VERSION"
            git push
          )
