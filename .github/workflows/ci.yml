name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── PWA tests ─────────────────────────────────────────────────────────────
  test-pwa:
    name: PWA tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Dependencies installeren
        run: npm ci

      - name: PWA tests draaien
        run: npm test

  # ── Backend unit tests ─────────────────────────────────────────────────────
  test-backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Unit tests draaien
        run: dotnet test app/backend.Tests/Prospero.Api.Tests.csproj -v minimal --filter "FullyQualifiedName~.Unit."

  # ── Backend integration tests ──────────────────────────────────────────────
  test-backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Integration tests draaien
        run: dotnet test app/backend.Tests/Prospero.Api.Tests.csproj -v minimal --filter "FullyQualifiedName~.Integration."

  # ── Aggregator: vereist door branch protection rule ───────────────────────
  tests:
    name: Tests
    needs: [test-pwa, test-backend-unit, test-backend-integration]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Controleer of alle tests geslaagd zijn
        run: |
          if [ "${{ needs.test-pwa.result }}" != "success" ] || \
             [ "${{ needs.test-backend-unit.result }}" != "success" ] || \
             [ "${{ needs.test-backend-integration.result }}" != "success" ]; then
            echo "Een of meer testjobs zijn mislukt"
            exit 1
          fi

  # ── Deploy productie (main → /) ────────────────────────────────────────────
  deploy-production:
    name: Deploy productie
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detecteer major versie wijziging
        run: |
          NEW_MAJOR=$(grep APP_VERSION js/version.js | sed "s/.*'\([0-9]*\)\..*/\1/")
          OLD_MAJOR=$(git show origin/gh-pages:js/version.js 2>/dev/null \
            | grep APP_VERSION \
            | sed "s/.*'\([0-9]*\)\..*/\1/" || echo "$NEW_MAJOR")
          echo "NEW_MAJOR=$NEW_MAJOR" >> $GITHUB_ENV
          if [ "$NEW_MAJOR" != "$OLD_MAJOR" ] && git show origin/gh-pages:js/version.js &>/dev/null; then
            echo "ARCHIVE=true" >> $GITHUB_ENV
            echo "ARCHIVE_VERSION=$OLD_MAJOR" >> $GITHUB_ENV
          fi

      - name: Haal huidige productie op voor archief
        if: env.ARCHIVE == 'true'
        run: |
          mkdir /tmp/old-prod
          cd /tmp/old-prod
          git init -q
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch origin gh-pages --depth=1 -q
          git checkout FETCH_HEAD -- . 2>/dev/null || true
          # Verwijder subdirs die niet gearchiveerd worden
          rm -rf dev v[0-9]* .git

      - name: Archiveer vorige major versie
        if: env.ARCHIVE == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/old-prod
          destination_dir: v${{ env.ARCHIVE_VERSION }}
          keep_files: true

      - name: Deploy naar productie
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pwa
          keep_files: true

  # ── Verwijder gemergte branches ───────────────────────────────────────────
  cleanup-branches:
    name: Verwijder gemergte branches
    needs: deploy-production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verwijder branches die in main zitten
        run: |
          git fetch --prune origin
          MERGED=$(git branch -r --merged origin/main \
            | grep -v 'origin/main' \
            | grep -v 'origin/gh-pages' \
            | sed 's|origin/||' \
            | tr -d ' ')
          if [ -z "$MERGED" ]; then
            echo "Geen branches te verwijderen"
            exit 0
          fi
          echo "Gemergte branches:"
          echo "$MERGED"
          for branch in $MERGED; do
            echo "Verwijder: $branch"
            git push origin --delete "$branch" || echo "Kon $branch niet verwijderen (al weg)"
          done
