name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'app/backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & deploy naar Azure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository owner
        run: echo "OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in op GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tag instellen (git SHA)
        run: echo "IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build en push Docker image
        uses: docker/build-push-action@v5
        with:
          context: app/backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/prospero-api:latest
            ghcr.io/${{ env.OWNER }}/prospero-api:${{ env.IMAGE_TAG }}

      - name: Log in op Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure subscription instellen
        run: az account set --subscription 4a5e156a-f162-44b8-99a0-826fff2a70c3

      - name: Deploy naar Azure Container Apps
        run: |
          az containerapp update \
            --name prospero-api \
            --resource-group prospero-rg \
            --image ghcr.io/${{ env.OWNER }}/prospero-api:${{ env.IMAGE_TAG }} \
            --set-env-vars \
              Jwt__Key=secretref:jwt-key \
              Jwt__Issuer=prospero \
              Jwt__ExpiresMinutes=60 \
              Auth__PasswordHash=secretref:auth-password-hash \
              EnableBanking__AppId=secretref:enablebanking-app-id \
              EnableBanking__PrivateKeyBase64=secretref:enablebanking-private-key \
              ConnectionStrings__Neon=secretref:neon-connection-string \
              ASPNETCORE_ENVIRONMENT=Production

      - name: "[Azure] Wacht op container start"
        run: |
          echo "=== Wachten op container start (max 60s) ==="
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.BACKEND_URL }}/health" || echo "000")
            echo "Poging $i/12 — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Container bereikbaar na $((i * 5))s"
              break
            fi
            if [ "$i" = "12" ]; then
              echo "ERROR: Container niet bereikbaar na 60s"
              exit 1
            fi
            sleep 5
          done

      - name: "[Azure] Container App health check"
        run: |
          echo "=== Azure Container App health check ==="
          RESPONSE=$(curl -s "${{ secrets.BACKEND_URL }}/health")
          echo "Response: $RESPONSE"
          STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','?'))")
          VERSION=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('version','?'))")
          TIMESTAMP=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('timestamp','?'))")
          echo "  Status:    $STATUS"
          echo "  Versie:    $VERSION"
          echo "  Tijdstip:  $TIMESTAMP"
          if [ "$STATUS" != "ok" ]; then
            echo "FAIL: status is niet 'ok'"
            exit 1
          fi
          echo "OK: Container App is gezond"

      - name: "[Neon] Database health check"
        run: |
          echo "=== Neon database health check ==="
          HTTP_CODE=$(curl -s -o /tmp/db_health.json -w "%{http_code}" "${{ secrets.BACKEND_URL }}/health/db")
          RESPONSE=$(cat /tmp/db_health.json)
          echo "HTTP status: $HTTP_CODE"
          echo "Response:    $RESPONSE"
          CONNECTED=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('connected','?'))")
          APPLIED=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('applied_migrations','?'))")
          PENDING=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('pending_migrations','?'))")
          echo "  Verbonden:          $CONNECTED"
          echo "  Toegepaste migraties: $APPLIED"
          echo "  Openstaande migraties: $PENDING"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "FAIL: database niet bereikbaar (HTTP $HTTP_CODE)"
            exit 1
          fi
          if [ "$PENDING" != "0" ]; then
            echo "WAARSCHUWING: $PENDING openstaande migratie(s) gevonden"
          fi
          echo "OK: Database is gezond"

      - name: Azure uitloggen
        if: always()
        run: az logout
