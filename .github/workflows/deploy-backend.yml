name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'app/backend/**'

jobs:
  deploy:
    name: Build & deploy naar Azure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository owner
        run: echo "OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in op GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build en push Docker image
        uses: docker/build-push-action@v5
        with:
          context: app/backend
          push: true
          tags: ghcr.io/${{ env.OWNER }}/prospero-api:latest

      - name: Log in op Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy naar Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ secrets.AZURE_CONTAINERAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ghcr.io/${{ env.OWNER }}/prospero-api:latest \
            --set-env-vars \
              Jwt__Key=secretref:jwt-key \
              Jwt__Issuer=prospero \
              Jwt__ExpiresMinutes=60 \
              Auth__PasswordHash=secretref:auth-password-hash \
              ASPNETCORE_ENVIRONMENT=Production

      - name: Smoke test
        run: |
          sleep 10
          curl -f ${{ secrets.BACKEND_URL }}/health | grep '"status":"ok"'

      - name: Azure uitloggen
        if: always()
        run: az logout
